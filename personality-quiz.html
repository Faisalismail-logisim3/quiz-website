<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personality Quiz - Discover Your Personality Type | QuizNest</title>

    <meta name="description" content="Take our free personality quiz and discover whether you are social, creative, calm or ambitious.">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://faisalismail-logisim3.github.io/quiz-website/personality-quiz.html">

    <link rel="stylesheet" href="style.css">

    <style>
        .personality-box {
            max-width: 700px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .question {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .answer-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f7f7f7;
            cursor: pointer;
            font-size: 16px;
        }

        .answer-btn:hover {
            background: #eee;
        }

        #result {
            display: none;
            text-align: center;
        }

        .restart-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <h1>QuizNest</h1>
        <p>Fun & Free Quizzes</p>
    </div>
</header>

<main class="container">

    <div class="personality-box">

        <div id="quiz">

            <h2>Personality Quiz</h2>

            <p>
                Answer these questions and discover your personality type.
            </p>

            <div id="question"></div>

            <div id="answers"></div>

        </div>

        <div id="result">

            <h2>Your Personality Result 🎉</h2>

            <h3 id="result-title"></h3>

            <p id="result-text"></p>

            <button class="restart-btn" onclick="restartQuiz()">
                Take Quiz Again
            </button>

        </div>

    </div>

</main>

<script>

const questions = [

    {
        question: "What do you usually do at a party?",
        answers: [
            { text: "Talk to everyone", type: "social" },
            { text: "Enjoy creative activities", type: "creative" },
            { text: "Stay relaxed and observe", type: "calm" },
            { text: "Meet people who can help my goals", type: "ambitious" }
        ]
    },

    {
        question: "Which activity do you enjoy most?",
        answers: [
            { text: "Hanging out with friends", type: "social" },
            { text: "Drawing, writing or creating", type: "creative" },
            { text: "Reading or relaxing", type: "calm" },
            { text: "Learning skills and achieving goals", type: "ambitious" }
        ]
    },

    {
        question: "How do you solve problems?",
        answers: [
            { text: "Ask other people for ideas", type: "social" },
            { text: "Think of unusual solutions", type: "creative" },
            { text: "Stay calm and think carefully", type: "calm" },
            { text: "Focus on the fastest way to succeed", type: "ambitious" }
        ]
    },

    {
        question: "What describes you best?",
        answers: [
            { text: "Friendly and outgoing", type: "social" },
            { text: "Imaginative and original", type: "creative" },
            { text: "Peaceful and patient", type: "calm" },
            { text: "Focused and determined", type: "ambitious" }
        ]
    },

    {
        question: "What motivates you?",
        answers: [
            { text: "Friends and relationships", type: "social" },
            { text: "New ideas", type: "creative" },
            { text: "Peace and balance", type: "calm" },
            { text: "Success and achievement", type: "ambitious" }
        ]
    },

    {
        question: "What would your friends say about you?",
        answers: [
            { text: "You are very social", type: "social" },
            { text: "You are very creative", type: "creative" },
            { text: "You are calm and patient", type: "calm" },
            { text: "You are ambitious", type: "ambitious" }
        ]
    }

];

let currentQuestion = 0;

let scores = {
    social: 0,
    creative: 0,
    calm: 0,
    ambitious: 0
};

function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("question").innerHTML =
        `<div class="question">
            Question ${currentQuestion + 1} of ${questions.length}<br><br>
            ${question.question}
        </div>`;

    const answersDiv = document.getElementById("answers");

    answersDiv.innerHTML = "";

    question.answers.forEach(answer => {

        const button = document.createElement("button");

        button.className = "answer-btn";

        button.textContent = answer.text;

        button.onclick = function() {
            selectAnswer(answer.type);
        };

        answersDiv.appendChild(button);

    });

}

function selectAnswer(type) {

    scores[type]++;

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}

function showResult() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    let winner = "social";

    for (let type in scores) {

        if (scores[type] > scores[winner]) {
            winner = type;
        }

    }

    const results = {

        social: {
            title: "You Are Social 🤝",
            text: "You are friendly, outgoing and enjoy connecting with people. You feel comfortable in social situations and love spending time with others."
        },

        creative: {
            title: "You Are Creative 🎨",
            text: "You have a creative mind and enjoy new ideas. You like expressing yourself and thinking differently from others."
        },

        calm: {
            title: "You Are Calm 🌿",
            text: "You are peaceful, patient and thoughtful. You prefer balance and usually stay calm even when things become difficult."
        },

        ambitious: {
            title: "You Are Ambitious 🚀",
            text: "You are focused, motivated and determined. You enjoy setting goals and working hard to achieve success."
        }

    };

    document.getElementById("result-title").textContent =
        results[winner].title;

    document.getElementById("result-text").textContent =
        results[winner].text;

}

function restartQuiz() {

    currentQuestion = 0;

    scores = {
        social: 0,
        creative: 0,
        calm: 0,
        ambitious: 0
    };

    document.getElementById("quiz").style.display = "block";

    document.getElementById("result").style.display = "none";

    showQuestion();

}

showQuestion();

</script>

</body>
</html>
