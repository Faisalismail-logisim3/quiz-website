<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IQ Quiz - Fun IQ Challenge | QuizNest</title>

    <meta name="description" content="Take our free fun IQ quiz and test your logic, patterns and problem-solving skills.">

    <link rel="canonical" href="https://faisalismail-logisim3.github.io/quiz-website/iq-quiz.html">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #222222;
        }

        header {
            background: #7c3aed;
            color: #ffffff;
            padding: 22px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .intro {
            text-align: center;
        }

        h2 {
            color: #7c3aed;
            margin-top: 0;
        }

        .intro p {
            color: #444444;
            line-height: 1.6;
        }

        .note {
            font-size: 14px;
            color: #666666 !important;
            margin-top: 20px;
        }

        .start-btn,
        .restart-btn {
            background: #7c3aed;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover,
        .restart-btn:hover {
            background: #6d28d9;
        }

        .hidden {
            display: none !important;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #7c3aed;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 14px;
            color: #666666;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            color: #222222;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* ANSWERS */
        .answer {
            display: block;
            width: 100%;
            padding: 16px 18px;
            margin: 12px 0;

            background: #ffffff;
            color: #222222;

            border: 2px solid #7c3aed;
            border-radius: 12px;

            font-size: 17px;
            font-weight: 600;
            text-align: left;

            cursor: pointer;
            transition: all 0.2s ease;
        }

        .answer:hover {
            background: #f5f3ff;
            color: #6d28d9;
            border-color: #6d28d9;
            transform: translateY(-1px);
        }

        .answer:active {
            transform: scale(0.98);
        }

        .result {
            text-align: center;
        }

        .result h2 {
            margin-bottom: 20px;
        }

        .score {
            font-size: 30px;
            font-weight: bold;
            color: #7c3aed;
            margin: 20px 0;
        }

        .result-title {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
            margin: 15px 0;
        }

        .result-text {
            color: #444444;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .box {
                padding: 22px;
            }

            .question {
                font-size: 18px;
            }

            .answer {
                font-size: 16px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🧠 QuizNest</h1>
</header>

<div class="container">

    <!-- INTRO -->
    <div id="intro" class="box intro">

        <h2>🧠 Fun IQ Challenge</h2>

        <p>
            Test your logic, patterns and problem-solving skills
            with this quick and fun quiz!
        </p>

        <button class="start-btn" onclick="startQuiz()">
            Start IQ Quiz
        </button>

        <p class="note">
            This is a fun quiz and is not a scientifically validated IQ test.
        </p>

    </div>


    <!-- QUIZ -->
    <div id="quiz" class="box hidden">

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionNumber" class="question-number"></div>

        <div id="question" class="question"></div>

        <div id="answers"></div>

    </div>


    <!-- RESULT -->
    <div id="result" class="box result hidden">

        <h2>🧠 Your IQ Quiz Result</h2>

        <div id="score" class="score"></div>

        <div id="resultTitle" class="result-title"></div>

        <p id="resultText" class="result-text"></p>

        <button class="restart-btn" onclick="restartQuiz()">
            🔄 Take Quiz Again
        </button>

        <br>

        <a href="index.html" class="back-link">
            ← Back to QuizNest
        </a>

    </div>

</div>


<script>

const questions = [

    {
        question: "What number comes next? 4, 8, 12, ?",
        answers: [
            "14",
            "16",
            "18",
            "20"
        ],
        correct: 1
    },

    {
        question: "Which one is different from the others?",
        answers: [
            "Apple",
            "Banana",
            "Carrot",
            "Orange"
        ],
        correct: 2
    },

    {
        question: "If all cats are animals and some animals are black, what can we say?",
        answers: [
            "All cats are black",
            "Some animals may be black",
            "No cats are animals",
            "All animals are cats"
        ],
        correct: 1
    },

    {
        question: "What comes next? 2, 4, 8, 16, ?",
        answers: [
            "20",
            "24",
            "32",
            "36"
        ],
        correct: 2
    },

    {
        question: "Which shape has 3 sides?",
        answers: [
            "Triangle",
            "Square",
            "Circle",
            "Rectangle"
        ],
        correct: 0
    },

    {
        question: "If you have 3 apples and get 2 more, how many apples do you have?",
        answers: [
            "4",
            "5",
            "6",
            "7"
        ],
        correct: 1
    }

];


let currentQuestion = 0;
let score = 0;
let answered = false;


function startQuiz() {

    currentQuestion = 0;
    score = 0;
    answered = false;

    document.getElementById("intro").classList.add("hidden");

    document.getElementById("result").classList.add("hidden");

    document.getElementById("quiz").classList.remove("hidden");

    showQuestion();
}


function showQuestion() {

    answered = false;

    const questionData = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").textContent =
        questionData.question;


    const answersBox = document.getElementById("answers");

    answersBox.innerHTML = "";


    questionData.answers.forEach(function(answerText, index) {

        const button = document.createElement("button");

        button.type = "button";

        button.className = "answer";

        button.textContent = answerText;

        button.addEventListener("click", function() {
            selectAnswer(index);
        });

        answersBox.appendChild(button);

    });


    const progress =
        (currentQuestion / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";
}


function selectAnswer(selectedIndex) {

    if (answered) {
        return;
    }

    answered = true;


    const correctIndex =
        questions[currentQuestion].correct;


    if (selectedIndex === correctIndex) {
        score++;
    }


    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(function(button) {
        button.disabled = true;
    });


    setTimeout(function() {

        currentQuestion++;


        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            showResult();

        }

    }, 300);
}


function showResult() {

    document.getElementById("quiz").classList.add("hidden");

    document.getElementById("result").classList.remove("hidden");

    document.getElementById("progressBar").style.width = "100%";


    document.getElementById("score").textContent =
        "Your Score: " + score + " / " + questions.length;


    let title;
    let text;


    if (score >= 5) {

        title = "Excellent Logical Thinking! 🧠🔥";

        text =
            "Great job! You showed strong logical thinking, pattern recognition and problem-solving skills.";

    }

    else if (score >= 3) {

        title = "Strong Problem-Solving Skills! 💪";

        text =
            "Nice work! You have good logical thinking and problem-solving ability.";

    }

    else if (score >= 1) {

        title = "Good Start! 🌟";

        text =
            "You have a good starting point. Keep practicing puzzles and logic challenges to improve.";

    }

    else {

        title = "Keep Practicing! 💪";

        text =
            "Don't worry! Try the quiz again and keep practicing logic and problem-solving questions.";

    }


    document.getElementById("resultTitle").textContent =
        title;

    document.getElementById("resultText").textContent =
        text;
}


function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;

    document.getElementById("result").classList.add("hidden");

    document.getElementById("intro").classList.remove("hidden");

    document.getElementById("progressBar").style.width = "0%";
}

</script>

</body>
</html>
