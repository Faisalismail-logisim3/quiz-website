<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IQ Quiz - Fun IQ Challenge | QuizNest</title>

    <meta name="description" content="Take our free fun IQ quiz and test your logic, patterns and problem-solving skills.">

    <link rel="canonical" href="https://faisalismail-logisim3.github.io/quiz-website/iq-quiz.html">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #222;
        }

        header {
            background: #7c3aed;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .intro {
            text-align: center;
        }

        h2 {
            color: #7c3aed;
        }

        .question-number {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .question {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .answer {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #7c3aed;
            background: #f5f3ff;
        }

        button.start,
        button.restart {
            border: none;
            border-radius: 10px;
            padding: 14px 22px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button.start:hover,
        button.restart:hover {
            background: #6d28d9;
        }

        .hidden {
            display: none;
        }

        .progress {
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #7c3aed;
            transition: width 0.3s;
        }

        .result {
            text-align: center;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        .result-title {
            font-size: 22px;
            margin: 15px 0;
        }

        .result-text {
            color: #555;
            line-height: 1.6;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #7c3aed;
            text-decoration: none;
            font-weight: bold;
        }

        .note {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .box {
                padding: 22px;
            }

            .question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🧠 QuizNest</h1>
</header>

<div class="container">

    <!-- INTRO -->
    <div id="intro" class="box intro">

        <h2>🧠 Fun IQ Challenge</h2>

        <p>
            Test your logic, patterns and problem-solving skills
            with this quick and fun quiz!
        </p>

        <button class="start" onclick="startQuiz()">
            Start IQ Quiz
        </button>

        <p class="note">
            This is a fun quiz and is not a scientifically validated IQ test.
        </p>

    </div>


    <!-- QUIZ -->
    <div id="quiz" class="box hidden">

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="questionNumber" class="question-number"></div>

        <div id="question" class="question"></div>

        <div id="answers"></div>

    </div>


    <!-- RESULT -->
    <div id="result" class="box result hidden">

        <h2>🧠 Your IQ Quiz Result</h2>

        <div id="score" class="score"></div>

        <div id="resultTitle" class="result-title"></div>

        <p id="resultText" class="result-text"></p>

        <button class="restart" onclick="restartQuiz()">
            🔄 Take Quiz Again
        </button>

        <br>

        <a class="back" href="index.html">
            ← Back to QuizNest
        </a>

    </div>

</div>


<script>

const questions = [

    {
        question: "1. What number comes next? 4, 8, 12, ?",
        answers: ["14", "16", "18", "20"],
        correct: 1
    },

    {
        question: "2. Which one is different from the others?",
        answers: ["Apple", "Banana", "Carrot", "Orange"],
        correct: 2
    },

    {
        question: "3. If all cats are animals and some animals are black, what can we say?",
        answers: [
            "All cats are black",
            "Some animals may be black",
            "No cats are animals",
            "All animals are cats"
        ],
        correct: 1
    },

    {
        question: "4. What comes next? 2, 4, 8, 16, ?",
        answers: ["20", "24", "32", "36"],
        correct: 2
    },

    {
        question: "5. Which shape has 3 sides?",
        answers: ["Triangle", "Square", "Circle", "Rectangle"],
        correct: 0
    },

    {
        question: "6. If you have 3 apples and get 2 more, how many apples do you have?",
        answers: ["4", "5", "6", "7"],
        correct: 1
    }

];


let currentQuestion = 0;
let score = 0;


function startQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("intro").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    showQuestion();
}


function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").textContent =
        question.question;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    question.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = answer;

        button.onclick = function() {
            selectAnswer(index);
        };

        answersContainer.appendChild(button);

    });


    const progress =
        ((currentQuestion) / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";
}


function selectAnswer(selectedAnswer) {

    const correctAnswer =
        questions[currentQuestion].correct;

    if (selectedAnswer === correctAnswer) {
        score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

        setTimeout(function() {
            showQuestion();
        }, 200);

    } else {

        setTimeout(function() {
            showResult();
        }, 200);

    }
}


function showResult() {

    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    document.getElementById("progressBar").style.width = "100%";

    document.getElementById("score").textContent =
        "Your Score: " + score + " / " + questions.length;


    let title = "";
    let text = "";


    if (score >= 5) {

        title = "Excellent Logical Thinking! 🧠🔥";

        text =
            "Great job! You showed strong logical thinking, pattern recognition and problem-solving skills.";

    }

    else if (score >= 3) {

        title = "Strong Problem-Solving Skills! 💪";

        text =
            "Nice work! You have good logical thinking and problem-solving ability.";

    }

    else if (score >= 1) {

        title = "Good Start! 🌟";

        text =
            "You have a good starting point. Keep practicing puzzles and logic challenges to improve.";

    }

    else {

        title = "Keep Practicing! 💪";

        text =
            "Don't worry! Try the quiz again and keep practicing logic and problem-solving questions.";

    }


    document.getElementById("resultTitle").textContent =
        title;

    document.getElementById("resultText").textContent =
        text;
}


function restartQuiz() {

    document.getElementById("result").classList.add("hidden");

    document.getElementById("intro").classList.remove("hidden");

    currentQuestion = 0;

    score = 0;

}

</script>

</body>
</html>
